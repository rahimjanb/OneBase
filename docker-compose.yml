name: onebase

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10 # v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC

  minio:
    # Официальные образы minio/minio больше не публикуются; pgsty/minio — поддерживаемый форк community-версии.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 # RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # консоль

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Tashkent # «сегодня» и текущий месяц продаж — по Ташкенту
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET}
      # «Файлы отделов»: домен подключения папок к Windows (WebDAV). Пусто — подключение не настроено (сайт с файлами работает).
      # В Cloudflare Tunnel: этот домен → http://nginx:82.
      Files__PublicDomain: ${FILE_STORAGE_DOMAIN:-}
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Llm__Provider: ${LLM_PROVIDER}
      Llm__ApiKey: ${LLM_API_KEY}
      Llm__Model: ${LLM_MODEL}
      Llm__EmbeddingModel: ${EMBEDDING_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LINKO_BASE_URL: ${LINKO_BASE_URL}
      LINKO_TOKEN: ${LINKO_TOKEN}
      LINKO_PLAN_TOKEN: ${LINKO_PLAN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      TZ: Asia/Tashkent
      # Домен Sales Base: на нём Next.js показывает полевые продажи (/field) и свой манифест PWA.
      FIELD_HOST: ${FIELD_HOST:-sales.1base.uz}
      # Основной домен — для ссылок из Sales Base в OneBase (консультант и т. п.).
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Шаблон: при старте nginx подставляет PUBLIC_HOST (публичный домен) и пишет conf.d/default.conf.
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Sales Base слушает :81 — в Cloudflare Tunnel: sales.1base.uz → http://nginx:81.
      FIELD_HOST: ${FIELD_HOST:-sales.1base.uz}
    # Снаружи сайт открывается через Cloudflare Tunnel (cloudflared → nginx по сети docker), порт наружу не нужен.
    # 127.0.0.1:8080 — для проверки на самом сервере: curl http://127.0.0.1:8080/health
    ports:
      - "${NGINX_BIND:-127.0.0.1:8080}:80"
      # Sales Base (:81) наружу не публикуется — занятый порт на сервере не дал бы стартовать nginx и основному сайту.
      # Проверка на сервере: docker compose exec -T nginx wget -qO- http://127.0.0.1:81/health
    depends_on:
      - api
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    profiles: ["tunnel"] # включается COMPOSE_PROFILES=tunnel в .env

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
