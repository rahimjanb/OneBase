# Шаблон: образ nginx подставляет ${PUBLIC_HOST} и ${FIELD_HOST} из окружения при старте (/etc/nginx/templates → conf.d).
# Переменные nginx вида $host не трогаются — подставляются только заданные переменные окружения.
#
# Два сайта на одном nginx:
#   :80 — OneBase (PUBLIC_HOST), в Cloudflare Tunnel: ваш-домен → http://nginx:80
#   :81 — Sales Base (FIELD_HOST, по умолчанию sales.1base.uz), в Cloudflare Tunnel: sales.1base.uz → http://nginx:81
# Отдельный порт, а не server_name: cloudflared может передать в Host внутреннее имя сервиса (nginx), а Next.js
# сверяет домен формы входа (Origin) с X-Forwarded-Host и по нему же открывает Sales Base.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # Публичный домен (PUBLIC_HOST в .env). cloudflared может передать в Host внутреннее имя сервиса (nginx),
    # а Next.js сверяет домен формы (Origin) с X-Forwarded-Host — поэтому домен берём из настроек.
    set $public_host "${PUBLIC_HOST}";
    if ($public_host = "") {
        set $public_host $host;
    }

    # Посетитель пришёл по http (Cloudflare передаёт это в X-Forwarded-Proto) — на https:
    # сессия ставится только с флагом Secure, по http вход не сохранится.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$public_host$request_uri;
    }

    # Настоящий IP пользователя: перед nginx — cloudflared из сети docker, он передаёт CF-Connecting-IP.
    # Доверяем заголовку только от частных адресов (контейнеры), из интернета его не подделать.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    proxy_set_header Host              $public_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $public_host;
    proxy_set_header X-Forwarded-Proto https; # HTTPS завершается в Cloudflare

    # Ответ консультанта идёт потоком до нескольких минут (с «пульсом» каждые 15 с).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        # Свои proxy_set_header в location отменяют наследование серверных — повторяем все.
        # Next.js сверяет X-Forwarded-Host с Origin формы входа; X-Real-IP нужен для лимита попыток входа.
        proxy_set_header Host              $public_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $public_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# Sales Base — полевые продажи (sales.1base.uz). Тот же Next.js и API: по X-Forwarded-Host Next.js показывает
# Sales Base (адреса вне /field переписываются в /field), свой манифест PWA и вход.
server {
    listen 81;
    server_name _;

    # Фото визитов — до 10 МБ.
    client_max_body_size 20m;

    set $field_host "${FIELD_HOST}";
    if ($field_host = "") {
        set $field_host $host;
    }

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$field_host$request_uri;
    }

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    proxy_set_header Host              $field_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $field_host;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $field_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $field_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
